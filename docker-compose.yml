services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brayano-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: brayano
      POSTGRES_PASSWORD: brayano
      POSTGRES_DB: brayano_ai

    ports:
      - "5432:5432"

    volumes:
      - brayano_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: brayano-ai-backend

    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    env_file:
      - .env

volumes:
  brayano_postgres_data:
services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brayano-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: brayano
      # Mot de passe de la base : définissez POSTGRES_PASSWORD dans .env (valeur par défaut « brayano » réservée au développement local).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brayano}
      POSTGRES_DB: brayano_ai

    ports:
      # La base n'est joignable que depuis cette machine, jamais depuis le réseau.
      - "127.0.0.1:5432:5432"

    volumes:
      - brayano_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: brayano-ai-backend

    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    env_file:
      - .env
    environment:
      PRODUCT_IMAGE_DIR: /data/product-images
    volumes:
      - brayano_product_images:/data/product-images

volumes:
  brayano_postgres_data:
  brayano_product_images:
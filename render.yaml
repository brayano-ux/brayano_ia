services:
  - type: web
    name: brayano-ai-backend
    runtime: docker
    plan: pro
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    disk:
      name: wa-session
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: /data/wa-session

services:
  - type: web
    name: brayano-ai-backend
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: ./wa-session

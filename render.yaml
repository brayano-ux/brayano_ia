services:
  - type: web
    name: brayano-ai-backend
    runtime: docker
    plan: pro
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    disk:
      name: wa-session
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYMENT_PROVIDER
        value: campay
      - key: CAMPAY_BASE_URL
        sync: false
      - key: CAMPAY_USERNAME
        sync: false
      - key: CAMPAY_PASSWORD
        sync: false
      - key: CAMPAY_CURRENCY
        value: XAF
      - key: CAMPAY_DEMO_AMOUNT
        value: "25"
      - key: CAMPAY_CALLBACK_URL
        sync: false
      - key: BILLING_PAGE_URL
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: PLATFORM_ADMIN_TOKEN
        sync: false
      - key: CLIENT_DASHBOARD_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: /data/wa-session

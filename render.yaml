services:
  - type: web
    name: brayano-ai-backend
    runtime: docker
    plan: pro
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    disk:
      name: wa-session
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Paiement des forfaits : Chariow (Mobile Money et carte). Campay n'est pas configuré en production.
      - key: PAYMENT_PROVIDER
        value: chariow
      # Clé API Chariow (sk_live_...) : démarre une session de paiement depuis la page « Mon forfait ».
      - key: CHARIOW_API_KEY
        sync: false
      # Secret de signature des Pulses Chariow (whsec_...) : le webhook /billing/chariow/pulse refuse tout sans lui.
      - key: CHARIOW_PULSE_SECRET
        sync: false
      # Signe les liens de photos : généré automatiquement par Render, ne jamais le partager.
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CAMPAY_BASE_URL
        sync: false
      - key: CAMPAY_USERNAME
        sync: false
      - key: CAMPAY_PASSWORD
        sync: false
      - key: CAMPAY_CURRENCY
        value: XAF
      - key: CAMPAY_DEMO_AMOUNT
        value: "25"
      - key: CAMPAY_CALLBACK_URL
        sync: false
      - key: BILLING_PAGE_URL
        sync: false
      # Forfaits appliqués : après les 100 messages d'essai (ou un forfait épuisé/terminé), l'assistant se tait,
      # le propriétaire reçoit un email et doit payer un forfait depuis « Mon forfait » pour le réactiver.
      # Les clients déjà inscrits sans forfait sont coupés dès le déploiement : leur en donner un avant
      # (POST /admin/organizations/:id/subscription) ou juste après.
      - key: BILLING_ENFORCED
        value: "true"
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: PLATFORM_ADMIN_TOKEN
        sync: false
      - key: CLIENT_DASHBOARD_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: /data/wa-session

    <style>
      /* Écran d'attente : affiché tout de suite, avant même le chargement des feuilles de style. */
      .boot-splash { position: fixed; inset: 0; z-index: 300; display: grid; place-content: center; justify-items: center; gap: 22px; background: #f5f7fa; }
      :root[data-theme="dark"] .boot-splash { background: #0a0f1a; }
      .boot-splash img { width: 56px; height: auto; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-bar { width: 132px; height: 3px; border-radius: 3px; background: rgba(31, 107, 255, 0.16); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #1f6bff; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash img, .boot-bar span { animation: none; } }
    </style>

<div class="app-shell hidden">
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <aside id="sidebar" class="sidebar" aria-label="Navigation principale">
    <a class="brand" href="#" aria-label="Brayano AI">
      <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><use href="#i-sparkles"/></svg></span>
      <span class="brand-name">brayano<span class="brand-accent">.</span></span>
    </a>

    <label class="org-picker">
      <span id="org-initial" class="org-initial">B</span>
      <span class="org-picker-text">
        <small>Espace de travail</small>
        <select id="org-select" aria-label="Choisir une entreprise"></select>
      </span>
      <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-selector"/></svg>
    </label>

    <nav class="nav" aria-label="Sections">
      <button class="nav-item active" data-view="overview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg><span>Vue d'ensemble</span></button>
      <button class="nav-item" data-view="inbox"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg><span>Conversations</span><b id="nav-count" class="nav-badge">0</b></button>
      <button class="nav-item" data-view="agent"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkles"/></svg><span>Agent IA</span></button>
      <p class="nav-group">Activité</p>
      <button class="nav-item" data-view="products"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-package"/></svg><span>Produits</span></button>
      <button class="nav-item" data-view="appointments"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-calendar"/></svg><span>Rendez-vous</span></button>
      <button class="nav-item" data-view="orders"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bag"/></svg><span>Commandes</span></button>
      <p class="nav-group">Canal</p>
      <button class="nav-item" data-view="whatsapp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-phone"/></svg><span>WhatsApp</span></button>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-item" data-view="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg><span>Paramètres</span></button>
      <div class="user-card">
        <span class="avatar" id="user-avatar">AD</span>
        <div>
          <strong id="user-name">Mon compte</strong>
          <small id="user-email">Compte principal</small>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-start">
        <button id="mobile-menu-trigger" class="mobile-menu-trigger icon-button" aria-label="Ouvrir le menu" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <div class="breadcrumb">Centre de pilotage <span>/</span> <strong id="current-org">Brayano</strong></div>
      </div>
      <div class="top-actions">
        <span class="system-status"><span class="live-dot"></span><span class="system-status-text">Système opérationnel</span></span>
      </div>
    </header>
    <div id="platform-suspension-banner" class="platform-banner hidden" role="alert"></div>
    <div id="views-root" class="views-root"></div>
  </main>

  <nav class="tabbar" aria-label="Navigation rapide">
    <button class="tab-item active" data-view="overview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg><span>Accueil</span></button>
    <button class="tab-item" data-view="inbox"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg><span>Messages</span></button>
    <button class="tab-item" data-view="agent"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkles"/></svg><span>Agent</span></button>
    <button class="tab-item" data-view="orders"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bag"/></svg><span>Commandes</span></button>
    <button class="tab-item" id="tab-more" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg><span>Plus</span></button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- VUE : CONVERSATIONS — liste à gauche, fil de discussion au centre, fiche du client à droite. -->
<section id="inbox-view" class="view view-full hidden">
  <div class="inbox">
    <aside class="inbox-list" aria-label="Conversations">
      <header class="inbox-list-head">
        <div class="spread">
          <h1 class="inbox-title">Conversations</h1>
          <span class="badge success" id="inbox-live-pill" title="La liste se met à jour toute seule, sans recharger la page"><i aria-hidden="true"></i>En direct</span>
        </div>
        <div class="input-group">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="inbox-search" class="inbox-search" type="search" placeholder="Rechercher un nom ou un numéro" aria-label="Chercher une conversation" autocomplete="off" />
        </div>
        <div id="inbox-stage-filters" class="chips scroll-x" role="group" aria-label="Filtrer les conversations"></div>
      </header>
      <p id="inbox-total" class="inbox-total" aria-live="polite"></p>
      <div id="all-conversations" class="conversation-list" aria-label="Liste des conversations">
        <div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span class="grow stack-sm"><span class="skeleton skeleton-line" style="width:45%"></span><span class="skeleton skeleton-line" style="width:75%"></span></span></div>
        <div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span class="grow stack-sm"><span class="skeleton skeleton-line" style="width:35%"></span><span class="skeleton skeleton-line" style="width:65%"></span></span></div>
        <div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span class="grow stack-sm"><span class="skeleton skeleton-line" style="width:50%"></span><span class="skeleton skeleton-line" style="width:70%"></span></span></div>
        <div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span class="grow stack-sm"><span class="skeleton skeleton-line" style="width:40%"></span><span class="skeleton skeleton-line" style="width:60%"></span></span></div>
        <div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span class="grow stack-sm"><span class="skeleton skeleton-line" style="width:55%"></span><span class="skeleton skeleton-line" style="width:80%"></span></span></div>
      </div>
    </aside>

    <section id="conversation-detail" class="inbox-thread" aria-label="Conversation sélectionnée">
      <div class="empty thread-empty">
        <span class="empty-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chats"/></svg></span>
        <p class="empty-title">Choisissez une conversation</p>
        <p class="empty-text">Sélectionnez un client dans la liste pour lire l'échange, répondre vous-même ou mettre l'agent en pause.</p>
      </div>
    </section>
  </div>
</section>

<!-- VIEW: INBOX -->
<section id="inbox-view" class="view hidden">
  <div class="page-heading">
    <div>
      <p class="eyebrow">RELATION CLIENT</p>
      <h1>Boîte de réception</h1>
      <p class="muted">Suivez vos clients, répondez-leur et reprenez la main quand il le faut.</p>
    </div>
    <span class="pill" id="inbox-live-pill"><i aria-hidden="true"></i> Mise à jour automatique</span>
  </div>

  <div class="inbox-layout">
    <section class="panel inbox-panel">
      <div class="inbox-toolbar">
        <strong id="inbox-total">Conversations</strong>
        <input id="inbox-search" class="inbox-search" type="search" placeholder="Rechercher…" aria-label="Chercher une conversation" autocomplete="off" />
      </div>
      <div id="inbox-stage-filters" class="stage-filters" role="tablist" aria-label="Filtrer par étiquette"></div>
      <div id="all-conversations" class="conversation-list" aria-label="Liste des conversations"></div>
    </section>

    <section id="conversation-detail" class="panel detail-panel">
      <div class="empty-state">Sélectionnez une conversation pour afficher les messages.</div>
    </section>
  </div>
</section>
